type Organization @table {
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Maps Firebase Auth UIDs to organizations for multi-tenant access control
type AuthUser @table(key: "uid") {
  uid: String! # Firebase Auth UID
}

type UserOrganization @table(key: ["user", "org"]) {
  user: AuthUser!
  org: Organization!
  role: String! @index # e.g., "ADMIN", "TEAM_LEAD", "MEMBER"
}

type ServingTeam @table {
  org: Organization!
  name: String!
}

type Member @table {
  org: Organization!
  firstName: String!
  lastName: String!
  email: String
  phone: String
  address: String
  joinDate: Date
  active: Boolean!
  servingTeam: ServingTeam
  servicesAttendedCount: Int64! @default(value: 0)
  lastAttendedDate: Timestamp
}

type Service @table {
  org: Organization!
  date: Timestamp!
  type: String!
  isActive: Boolean!
}

type Attendance @table(key: ["member", "service"]) {
  org: Organization!
  member: Member!
  service: Service!
  timestamp: Timestamp!
}
