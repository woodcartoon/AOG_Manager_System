<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' data:;
                   connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasedataconnect.googleapis.com https://*.googleapis.com">
    <title>Sign in · AOG Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">Light mode</button>
    <div class="page">

        <!-- Left: identity panel. Decorative, hidden from screen readers. -->
        <aside class="brand" aria-hidden="true">
            <div class="arch">
                <span class="arch__glass"></span>
                <span class="arch__sweep"></span>
            </div>
            <p class="brand__mark">AOG<span>Manager</span></p>
            <p class="brand__note">One record for every member, service and report.</p>
        </aside>

        <!-- Right: the form -->
        <main class="panel">
            <header class="panel__head">
                <p class="panel__eyebrow">Assemblies of God</p>
                <h1>Welcome back</h1>
                <p class="panel__sub">Sign in to the manager portal to record attendance, update members and pull reports.</p>
            </header>

            <form class="form" id="loginForm" novalidate>
                <div class="field">
                    <input type="email" id="email" name="email" placeholder=" "
                           autocomplete="username" required>
                    <label for="email">Email address</label>
                </div>

                <div class="field field--password">
                    <input type="password" id="password" name="password" placeholder=" "
                           autocomplete="current-password" required>
                    <label for="password">Password</label>
                    <button type="button" class="reveal" id="revealPassword"
                            aria-controls="password" aria-pressed="false" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 12S5.4 5.5 12 5.5 22.2 12 22.2 12 18.6 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/><line class="reveal__slash" x1="4" y1="20" x2="20" y2="4"/></svg>
                    </button>
                    <p class="hint" id="capsHint" hidden>Caps lock is on.</p>
                </div>

                <p class="form__error" id="formError" role="alert" hidden></p>

                <button type="submit" class="btn btn--primary" id="submitBtn">
                    <span class="btn__label">Sign in</span>
                    <span class="btn__spinner" aria-hidden="true"></span>
                </button>

            </form>

            <p class="panel__foot">Trouble signing in? Ask your church administrator to reset your details.</p>
        </main>

    </div>

    <script src="firebase-client.bundle.js"></script>
    <script src="../login.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
